<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign Estate Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Above-the-fold instant critical rendering styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #0d0d0f;
        color: #f3f4f6;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .instant-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .instant-card {
        width: 100%;
        max-width: 28rem;
        background: linear-gradient(145deg, #18181c 0%, #121215 100%);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .instant-logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem auto;
        border-radius: 9999px;
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid rgba(212, 175, 55, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4af37;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 1.25rem;
      }
      .instant-title {
        font-family: 'Cinzel', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #f3f4f6;
        margin: 0 0 0.5rem 0;
        letter-spacing: 0.05em;
      }
      .instant-subtitle {
        font-size: 0.875rem;
        color: #9ca3af;
        margin: 0 0 1.5rem 0;
      }
      .instant-skeleton {
        height: 2.75rem;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        animation: instantPulse 1.5s infinite ease-in-out;
      }
      @keyframes instantPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Above-the-Fold Skeleton Shell (<50ms Paint) -->
      <div class="instant-shell">
        <div class="instant-card">
          <div class="instant-logo">SE</div>
          <h1 class="instant-title">SOVEREIGN ESTATE</h1>
          <p class="instant-subtitle">Imperial Property & Rental Command</p>
          <div class="instant-skeleton"></div>
          <div class="instant-skeleton" style="height: 2.5rem; width: 80%; margin: 0 auto;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
